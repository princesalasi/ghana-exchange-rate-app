name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Keepalive backup for the 60-day limit. Runs first so a rate source outage
      # cannot skip it. A failure here must not stop the rate update.
      - name: Keep schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

      - name: Update rates
        run: python scripts/fetch_rates.py

      # Each commit also counts as repository activity, which stops GitHub
      # disabling this schedule after 60 quiet days.
      - name: Commit changed rates
        run: |
          git add rates.json
          if git diff --cached --quiet; then
            echo "No rate changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update exchange rates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare site
        run: |
          mkdir site
          cp index.html style.css calc.js script.js rates.json manifest.json service-worker.js icon.svg icon-180.png icon-192.png icon-512.png icon-maskable-512.png site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
