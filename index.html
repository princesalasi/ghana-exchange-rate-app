<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-title" content="FX App" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Manrope:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="./style.css" />
  <title>Ghana Exchange Rates</title>
</head>

<body>

  <main class="app" id="converterScreen">

    <header class="top">
      <div class="top-row">
        <h1>Ghana FX</h1>
        <div class="segment" role="group" aria-label="Rate type">
          <button type="button" id="buyingButton">Buying</button>
          <button type="button" id="sellingButton">Selling</button>
        </div>
      </div>
      <p id="status" class="status">Loading latest rates...</p>
    </header>

    <div class="layout">
      <section class="rows-panel" aria-label="Currencies">
        <div id="rows" class="rows"></div>
        <button type="button" id="openPicker" class="add-button">Add or remove currencies</button>
      </section>

      <section id="keypad" class="keypad" aria-label="Calculator keypad"></section>

      <section class="rate-table" aria-labelledby="tableTitle">
        <h2 id="tableTitle">Bank of Ghana rates per unit, in cedis</h2>
        <table>
          <thead>
            <tr><th scope="col">Currency</th><th scope="col">Buying</th><th scope="col">Selling</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </div>

    <footer id="credits" class="credits"></footer>

  </main>

  <section class="app picker" id="pickerScreen" aria-label="Choose currencies" hidden>
    <div class="top">
      <div class="top-row">
        <h1>Currencies</h1>
        <button type="button" id="closePicker" class="done-button">Done</button>
      </div>
      <label class="search" for="search">Search by name or code
        <input id="search" type="search" placeholder="Try kenya or KES" autocomplete="off" />
      </label>
    </div>
    <div id="choices" class="choices"></div>
  </section>

  <script src="./calc.js" defer></script>
  <script src="./script.js" defer></script>

</body>
</html>
